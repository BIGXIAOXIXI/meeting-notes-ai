<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>会议纪要助手</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    textarea { width: 100%; min-height: 160px; box-sizing: border-box; padding: 0.6rem; }
    .row { margin-top: 0.75rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    button.secondary { background: #f3f4f6; border: 1px solid #d1d5db; }
    button:disabled { opacity: 0.6; cursor: wait; }
    #out { margin-top: 1.5rem; white-space: pre-wrap; background: #f5f5f5; padding: 1rem; border-radius: 8px; min-height: 80px; }
    #out.err { background: #fef2f2; color: #991b1b; }
  </style>
</head>
<body>
  <h1>会议 / 课堂记录 → 纪要 + 行动项</h1>
  <p>给开完会或下完课懒得整理的人：粘贴凌乱记录，一键变成纪要和行动项。</p>
  <textarea id="input" placeholder="在此粘贴会议或课堂记录…"></textarea>
  <div class="row">
    <button type="button" class="secondary" id="ex1">示例：产品周会</button>
    <button type="button" class="secondary" id="ex2">示例：课堂笔记</button>
    <button type="button" id="btn">生成纪要</button>
  </div>
  <div id="out">结果会显示在这里。</div>
  <script>
    var exMeeting =
      "今天产品周会。小王说落地页转化率上周掉到 2.1%，怀疑是新 Banner。小李负责本周五前出 A/B 方案，对照旧版。设计侧阿美周一给两套稿。技术老陈提到接口偶发超时，先加 3 秒重试，本周三前合到测试环境。下周四全员评审 Demo，材料提前一天发群。";
    var exClass =
      "高数课：老师讲了导数定义和几何意义。作业：习题 3.2 的 1–8 题，周五交。下节课小测链式法则。同桌提醒我把错题本带上。我没听懂隐函数求导，准备晚自习问老师。";

    document.getElementById("ex1").onclick = function () {
      document.getElementById("input").value = exMeeting;
    };
    document.getElementById("ex2").onclick = function () {
      document.getElementById("input").value = exClass;
    };

    document.getElementById("btn").onclick = async function () {
      var text = document.getElementById("input").value.trim();
      var out = document.getElementById("out");
      var btn = document.getElementById("btn");
      out.className = "";
      if (!text) {
        out.className = "err";
        out.textContent = "还没内容：先粘贴记录，或点上面的示例按钮。";
        return;
      }
      btn.disabled = true;
      out.textContent = "正在生成，请稍等…";
      try {
        var r = await fetch("/api/summarize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text }),
        });
        var data = await r.json().catch(function () { return {}; });
        if (!r.ok) {
          out.className = "err";
          out.textContent =
            "生成失败（" + r.status + "）：" +
            (data.error || "请检查 .env 里的 Key，以及 server.js 是否在运行。");
        } else {
          out.textContent = data.result || "模型返回了空内容，换一段记录再试。";
        }
      } catch (e) {
        out.className = "err";
        out.textContent =
          "连不上本机服务。请确认已运行 node server.js，并用 http://localhost:3000 打开（不要直接双击 html）。";
      }
      btn.disabled = false;
    };
  </script>
</body>
</html>
